name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place for the Electron binary on every OS, so one cache entry shape serves all jobs.
  ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
  NODE_VERSION: 24

jobs:
  # Gates run as parallel jobs; each one is `scripts/verify.mjs` over a group of steps (which itself runs
  # them concurrently), so the wall time is the slowest group instead of the sum.
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static (format, types, lint, i18n)
            steps: format typecheck-electron typecheck-app typecheck-spec lint i18n
          - name: Renderer tests
            steps: test-renderer
          - name: Electron tests
            steps: test-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # tsc/eslint/prettier/Angular caches: a PR rechecks only what it touched.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            .angular/cache
          key: gates-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: gates-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: node scripts/verify.mjs --all ${{ matrix.steps }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The build needs no Electron binary.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ng-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: ng-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            dist/renderer
            dist-electron
          retention-days: 1
          if-no-files-found: error

  test-ui:
    name: UI browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/cache@v4
        with:
          path: |
            .angular/cache
            ~/.cache/ms-playwright
          key: ui-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: ui-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  e2e-smoke:
    name: E2E smoke
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: app-build
      - name: Run smoke e2e
        run: xvfb-run -a npm run e2e -- --no-build
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-output/
          retention-days: 7

  # One stable name for branch protection.
  ci:
    name: CI
    if: always()
    needs: [verify, test-ui, build, e2e-smoke]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
