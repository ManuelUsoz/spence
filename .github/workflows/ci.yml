name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place for the Electron binary on every OS, so one cache entry shape serves all jobs.
  ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
  NODE_VERSION: 24

jobs:
  # Gates run as parallel jobs; each one is `scripts/verify.mjs` over a group of steps (which itself runs
  # them concurrently), so the wall time is the slowest group instead of the sum.
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static (format, types, lint, i18n)
            steps: format typecheck-electron typecheck-app typecheck-spec lint i18n
          - name: Renderer tests
            steps: test-renderer
          - name: Electron tests
            steps: test-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # tsc/eslint/prettier/Angular caches: a PR rechecks only what it touched.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            .angular/cache
          key: gates-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: gates-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: node scripts/verify.mjs --all ${{ matrix.steps }}

  # Decides what e2e has to run: the diff's reach, never less than the Linux build.
  plan:
    name: Plan e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      specs: ${{ steps.plan.outputs.specs }}
      es: ${{ steps.plan.outputs.es }}
      windows: ${{ steps.plan.outputs.windows }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: plan
        # main and manual runs always run everything, on every OS and in both locales.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            node scripts/e2e/affected.mjs --base="origin/${{ github.base_ref }}" | tee plan.json
          else
            node scripts/e2e/affected.mjs --full | tee plan.json
          fi

  # The build is platform independent (Angular output + a pure JS main bundle), so it is built once on Linux
  # and every e2e shard downloads it instead of rebuilding.
  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The build needs no Electron binary.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ng-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: ng-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            dist/renderer
            dist-electron
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: e2e ${{ matrix.os-name }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: [plan, build]
    if: needs.plan.outputs.mode != 'none'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Linux shards always; Windows shards only when the plan asks for them (scripts/e2e/affected.mjs).
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: app-build
      # The changes specs commit in throwaway repos.
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
        shell: bash
      - name: Run e2e
        shell: bash
        env:
          # The diff's spec folders on a PR; empty (= everything) otherwise. Screenshot baselines are
          # machine dependent, so CI checks the flows only.
          SPECS: ${{ needs.plan.outputs.mode == 'subset' && needs.plan.outputs.specs || '' }}
          PROJECTS: ${{ needs.plan.outputs.es == 'true' && '--project=en --project=es' || '--project=en' }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          # Real windows: Xvfb on Linux gives each job its own display.
          SPENCE_E2E_WORKERS: ${{ matrix.os-name == 'linux' && '3' || '2' }}
        run: |
          RUN="npx playwright test --ignore-snapshots --pass-with-no-tests --shard=$SHARD $PROJECTS $SPECS"
          if [ "${{ matrix.os-name }}" = "linux" ]; then
            xvfb-run -a $RUN
          else
            $RUN
          fi
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os-name }}-${{ matrix.shard }}
          path: e2e-output/
          retention-days: 7

  # One stable name for branch protection, whatever the plan skipped.
  ci:
    name: CI
    if: always()
    needs: [verify, plan, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
