name: Beta build for review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win nsis
            artifact: release/*.exe
          - name: Linux
            os: ubuntu-latest
            target: --linux AppImage
            artifact: release/*.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - name: Package without publishing
        run: npx electron-builder ${{ matrix.target }} --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: beta-review-${{ matrix.name }}-x64
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
