name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]{0,7})?$ ]] || [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match package version vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
          if [[ "$version" == *-rc.* ]]; then echo 'prerelease=true' >> "$GITHUB_OUTPUT"; else echo 'prerelease=false' >> "$GITHUB_OUTPUT"; fi
  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/make/squirrel.windows/x64/*
          if-no-files-found: error
  ubuntu:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot
      - run: npm ci
      - run: npm run build
      - run: npx electron-forge make --targets=@electron-forge/maker-deb --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: out/make/deb/x64/*.deb
          if-no-files-found: error
  publish:
    needs: [validate, windows, ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: |
            artifacts/*.exe
            artifacts/*.nupkg
            artifacts/RELEASES
            artifacts/*.deb
          fail_on_unmatched_files: true
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
