<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Source control — throwaway prototype</title>
    <link rel="stylesheet" href="/fonts/sans/index.css" />
    <link rel="stylesheet" href="/fonts/mono/400.css" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/prototype.css" />
    <script type="module" src="/prototype.js"></script>
  </head>
  <body>
    <header class="lab">
      <span>Throwaway prototype · fictional files · no disk changes</span
      ><label
        >Scenario
        <select id="scenario"></select></label
      ><button id="reset">Reset</button>
    </header>
    <div id="app"></div>
    <dialog id="dialog">
      <form method="dialog"><button class="close" aria-label="Close">×</button></form>
      <div id="dialog-content"></div>
    </dialog>
    <footer class="switcher">
      <button id="previous" aria-label="Previous variant">←</button><span id="variant-label"></span
      ><button id="next" aria-label="Next variant">→</button>
      <details>
        <summary>Prototype state</summary>
        <pre id="state"></pre>
      </details>
    </footer>
  </body>
</html>
