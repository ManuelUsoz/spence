<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:var(--font-sans);color:var(--foreground)}*{box-sizing:border-box}button{font:inherit;cursor:pointer;background:var(--secondary);color:inherit;border:1px solid var(--border);border-radius:7px;padding:7px 12px}.muted,small{color:var(--muted-foreground)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.thread{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:20px}.user{text-align:right;margin:0 0 25px}.user span{background:var(--secondary);padding:10px 14px;border-radius:12px;display:inline-block}.answer{line-height:1.6;font-size:14px}h2{font-size:18px;font-weight:500;letter-spacing:normal;margin:12px 0}p{margin:12px 0}code,pre,kbd{font-family:var(--font-mono);font-weight:400;font-size:12px}code{background:var(--muted);padding:2px 4px;border-radius:4px}.code{border:1px solid var(--border);border-radius:8px;overflow:hidden}.code header{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;background:var(--muted);font-size:12px}pre{padding:12px;margin:0;overflow:auto;white-space:pre-wrap}.answer blockquote{border-left:2px solid var(--border);margin:14px 0;padding:0 14px;color:var(--muted-foreground)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid var(--border);padding:9px}a{color:var(--foreground);text-decoration:underline}.answer.B>section{border-top:1px solid var(--border);margin-top:18px;padding-top:14px}.answer.C{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.answer.C .wide{grid-column:1/-1}.draft{border:1px solid var(--input);border-radius:9px;margin-top:24px;padding:14px;color:var(--muted-foreground)}.switch{display:flex;justify-content:center;align-items:center;gap:14px;margin:20px auto;width:fit-content;background:var(--secondary);padding:7px;border-radius:25px}.state{font-size:12px;line-height:1.6}.cursor{border-right:2px solid var(--foreground)}@media(max-width:500px){.answer.C{display:block}}
</style></head><body><p class="muted">Throwaway thread study · presentation only · planned Spartan typography, table and Code Block composition.</p><div class="tools"><button onclick="stream()">Replay streaming</button><button onclick="settle()">Settled</button><button onclick="raw=!raw;draw()">Toggle literal HTML case</button></div><div class="thread"><div class="user"><span>Explain the change and show a usage example.</span></div><div id="answer" class="answer"></div><div class="draft">Write a message…</div></div><div class="switch"><button onclick="cycle(-1)" aria-label="Previous layout">←</button><span id="label"></span><button onclick="cycle(1)" aria-label="Next layout">→</button></div><p id="state" class="state muted"></p><script>
const code="const result = await loadSession(id);\nreturn result.messages;";
const names=['A · Continuous prose','B · Separated sections','C · Summary and example columns'];let v=Math.max(0,['A','B','C'].indexOf(new URLSearchParams(location.search).get('variant'))),raw=true,step=4,timer=null;
const blocks=['<section><h2>Load the conversation</h2><p>The loader restores the <strong>Session</strong> and its Messages. Use <code>loadSession(id)</code> to read it.</p><ul><li>Keep the existing transcript.</li><li>Restore the latest context.</li></ul></section>','<section><blockquote>Reopening a Session should feel immediate.</blockquote><table><thead><tr><th>State</th><th>Result</th></tr></thead><tbody><tr><td>Saved</td><td>Messages restored</td></tr><tr><td>Empty</td><td>Composer ready</td></tr></tbody></table></section>','<section class="wide"><div class="code"><header><span>TypeScript</span><button id="copy" onclick="copyCode()">Copy</button></header><pre id="code"></pre></div></section>','<section class="wide"><p>☑ Preserve transcript &nbsp; ☐ Check resume behavior</p><p><a href="https://example.com" target="_blank" rel="noopener noreferrer">Documentation ↗</a> · <code>./session.ts</code> (plain text)</p></section>'];
function draw(){const a=document.getElementById('answer');a.className='answer '+['A','B','C'][v];a.innerHTML=blocks.slice(0,step).join('')+(step<4?'<p class="muted cursor">Restoring the next part…</p>':'')+(raw&&step===4?'<p>Raw HTML is literal: <code>&lt;b&gt;Hello&lt;/b&gt;</code></p><pre>&lt;script&gt;alert("example")&lt;/script&gt;</pre>':'');const c=document.getElementById('code');if(c)c.textContent=code;document.getElementById('label').textContent=names[v];document.getElementById('state').textContent='State: '+(step<4?'streaming demonstration':'settled')+' · '+(raw?'literal HTML shown':'HTML case hidden')+' · sample output. Replay reveals prepared blocks; it does not exercise remark parsing, Angular reconciliation, security validation or real Agent streaming.'}
function stream(){clearInterval(timer);step=1;draw();timer=setInterval(()=>{step++;draw();if(step===4)clearInterval(timer)},1100)}
function settle(){clearInterval(timer);step=4;draw()}
function cycle(n){v=(v+n+3)%3;try{history.replaceState(null,'','?variant='+['A','B','C'][v])}catch{}draw()}
async function copyCode(){try{await navigator.clipboard.writeText(code);document.getElementById('copy').textContent='Copied'}catch{document.getElementById('copy').textContent='Clipboard unavailable'}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});draw();
</script></body></html>
