<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:var(--font-sans);color:var(--foreground);margin:0}*{box-sizing:border-box}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:var(--secondary);border:1px solid var(--border);border-radius:8px;padding:7px 11px}small,.muted{color:var(--muted-foreground)}.scene{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}.reply{padding:14px 0 28px;line-height:1.6}.palette{border:1px solid var(--border);border-radius:10px;background:var(--popover);overflow:hidden}.row{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:11px 12px}.row.selected{background:var(--accent)}.rowtop{display:flex;justify-content:space-between;gap:12px}.badge{font-size:11px;border:1px solid var(--border);border-radius:5px;padding:2px 5px;white-space:nowrap}.desc{font-size:12px;margin-top:5px;color:var(--muted-foreground)}.owner{font-size:12px}.group{padding:9px 12px 4px;font-size:12px;color:var(--muted-foreground)}.split{display:grid;grid-template-columns:1fr 1fr}.details{border-left:1px solid var(--border);padding:16px;font-size:13px;line-height:1.6}textarea{display:block;width:100%;resize:vertical;min-height:78px;background:var(--background);border:1px solid var(--input);border-radius:10px;margin-top:10px;padding:12px}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;font-size:12px}kbd,code{font-family:var(--font-mono);font-size:11px;font-weight:400}.switch{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px auto 8px;width:fit-content;border:1px solid var(--border);border-radius:30px;padding:7px;background:var(--secondary)}.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.state{font-size:12px;padding-top:12px;line-height:1.7}@media(max-width:480px){.split{grid-template-columns:1fr}.details{border-left:0;border-top:1px solid var(--border)}.owner{font-size:11px}}
</style></head><body>
<p class="muted">Throwaway Composer study · sample entries · choose a layout, then type / or search a description.</p>
<div class="scene"><div class="muted">Session · Claude</div><div class="reply">The changes are ready to review. What would you like to do next?</div>
<div class="tools"><button onclick="mode='ready';opened=true;render()">Available</button><button onclick="mode='loading';render()">Loading</button><button onclick="mode='empty';render()">Empty</button><button onclick="refresh()">Simulate update</button></div>
<div id="palette" class="palette"></div><textarea id="draft" aria-label="Message" placeholder="Write a message, or / for skills and commands">/</textarea><div class="foot"><span><kbd>↑ ↓</kbd> select · <kbd>Tab</kbd> insert · <kbd>Esc</kbd> dismiss</span><button onclick="send()">Send</button></div><div id="hint" class="muted"></div></div>
<div class="switch"><button aria-label="Previous layout" onclick="cycle(-1)">←</button><span id="variant"></span><button aria-label="Next layout" onclick="cycle(1)">→</button></div><div id="state" class="state muted"></div>
<script>
const entries=[{id:'app-clear',name:'/clear',kind:'Command',owner:'Spence',desc:'Start a fresh Agent context',invoke:'/clear',hint:''},{id:'app-compact',name:'/compact',kind:'Command',owner:'Spence',desc:'Summarize the current context',invoke:'/compact',hint:''},{id:'skill-review',name:'/review',kind:'Skill',owner:'Claude · Anthropic',desc:'Review changes for correctness and risks',invoke:'/review',hint:'Optional branch or review focus'},{id:'cmd-status',name:'/status',kind:'Command',owner:'Claude · Anthropic',desc:'Inspect the current Agent session',invoke:'/status',hint:''},{id:'skill-explain',name:'/explain',kind:'Skill',owner:'Claude · Anthropic',desc:'Explain an unfamiliar part of the codebase',invoke:'/explain',hint:'File or question'}];
const names=['A · Compact list','B · Grouped by owner','C · List and details'];let variant=Math.max(0,['A','B','C'].indexOf(new URLSearchParams(location.search).get('variant'))),mode='ready',opened=true,index=0,chosen=null,updated=false;
const draft=document.getElementById('draft'),palette=document.getElementById('palette');
function list(){const q=draft.value.startsWith('/')?draft.value.slice(1).toLowerCase():'';return entries.filter(e=>(!updated||e.id!=='skill-explain')&&(e.name+' '+e.desc).toLowerCase().includes(q))}
function row(e,i){return '<button class="row '+(i===index?'selected':'')+'" onmouseenter="index='+i+';detail()" onclick="pick('+i+')"><span class="rowtop"><span>'+e.name+'</span><span class="badge">'+e.kind+'</span></span><div class="desc">'+e.desc+'</div><div class="owner">'+e.owner+'</div></button>'}
function render(){const items=list();index=Math.max(0,Math.min(index,items.length-1));document.getElementById('variant').textContent=names[variant];palette.hidden=!opened;if(mode==='loading')palette.innerHTML='<div class="details">Loading Agent entries…</div>';else if(mode==='empty'||!items.length)palette.innerHTML='<div class="details">No commands available'+(mode==='empty'?'.':' for this search.')+'</div>';else if(variant===0)palette.innerHTML=items.map(row).join('');else if(variant===1){palette.innerHTML=['Spence','Claude · Anthropic'].map(owner=>'<div class="group">'+owner+'</div>'+items.map((e,i)=>e.owner===owner?row(e,i):'').join('')).join('')}else palette.innerHTML='<div class="split"><div>'+items.map(row).join('')+'</div><div class="details" id="detail"></div></div>';detail();document.getElementById('state').textContent='State: '+mode+' · '+(opened?'palette open':'palette closed')+' · '+(chosen?'selected '+chosen.name+' · owner '+chosen.owner:'nothing inserted')+' · '+(updated?'updated catalog':'initial catalog');}
function detail(){const e=list()[index];const d=document.getElementById('detail');if(d&&e)d.textContent=e.kind+' · '+e.owner+' — '+e.desc+(e.hint?'. Argument hint: '+e.hint:'')+'. Selection inserts text; it does not send.'}
function pick(i){const e=list()[i];if(!e)return;chosen=e;draft.value=e.invoke+' ';opened=false;document.getElementById('hint').textContent=e.hint;render();draft.focus()}
function cycle(n){variant=(variant+n+3)%3;try{history.replaceState(null,'','?variant='+['A','B','C'][variant])}catch{}render()}
function refresh(){updated=!updated;render()}
function send(){document.getElementById('hint').textContent='Demo only: '+(chosen&&chosen.owner==='Spence'?'Spence handles this app command.':'Agent Message text: '+draft.value)}
draft.addEventListener('input',()=>{opened=draft.value.startsWith('/');index=0;chosen=null;document.getElementById('hint').textContent='';render()});
draft.addEventListener('keydown',e=>{if(!opened)return;if(e.key==='Escape'){e.preventDefault();opened=false;render()}else if(mode==='ready'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const n=list().length;if(n)index=(index+(e.key==='ArrowDown'?1:-1)+n)%n;render()}else if(mode==='ready'&&e.key==='Tab'&&list().length){e.preventDefault();pick(index)}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>
