<!doctype html>
<!-- PROTOTYPE (throwaway, issue #92): three structurally different UIs for LAN Devices.
     Question: where do discovery / pairing / revocation live, and how do Local vs Remote ownership,
     Offline/Reconnecting, Attention and the human P2P entry point show up without clutter?
     Open by double-click. Arrow keys or the bottom bar switch variants. State is in memory only. -->
<html lang="en"><head><meta charset="utf-8"><title>PROTOTYPE · LAN Devices UI</title>
<style>
:root{--bg:#fff;--fg:#1a1a1f;--mut:#74747f;--bd:#e7e7ea;--side:#fafafa;--acc:#f0f0f2;--att:#d9980f;--ok:#2f9e63;--bad:#c7402d;--r:10px}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 system-ui,sans-serif;color:var(--fg);background:#e9e9ec;height:100vh;display:flex;flex-direction:column}
#app{flex:1;display:flex;margin:14px 14px 64px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;overflow:hidden;min-height:0}
aside{width:272px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px;gap:2px;overflow:auto}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:42px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:10px}
.tabs{display:flex;gap:4px;flex:1}.tab{padding:5px 10px;border-radius:8px;color:var(--mut);cursor:pointer;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--acc);color:var(--fg)}
.body{flex:1;overflow:auto;padding:22px 28px}
.h{font-size:11px;color:var(--mut);padding:10px 8px 3px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.row{padding:5px 8px;border-radius:8px;display:flex;gap:7px;align-items:center;cursor:pointer}
.row:hover,.row.on{background:var(--acc)}.sub{color:var(--mut);font-size:11.5px}.dim{opacity:.5}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}.dot.rec{background:var(--att)}.dot.off{background:#b9b9c1}
.att{width:7px;height:7px;border-radius:50%;background:var(--att);flex:none}
.chip{font-size:10.5px;border:1px solid var(--bd);border-radius:99px;padding:0 6px;color:var(--mut);white-space:nowrap}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:5px 11px;cursor:pointer;font:inherit}.btn.p{background:var(--fg);color:#fff;border-color:var(--fg)}.btn.d{color:var(--bad)}
.card{border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin:8px 0;display:flex;gap:12px;align-items:center}
.card .g{flex:1}.code{font:600 30px ui-monospace,monospace;letter-spacing:.25em}
.msg{max-width:560px;margin:8px 0;padding:8px 12px;border-radius:var(--r);background:var(--acc)}.msg.me{background:#1a1a1f;color:#fff;margin-left:auto}
.prov{font-size:11px;color:var(--mut);margin-bottom:2px}
.comp{margin:0 28px 18px;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.comp .st{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:11.5px;margin-top:6px}
.banner{margin:0 28px 10px;padding:7px 12px;border-radius:8px;background:#fff7e6;color:#7a5200;display:flex;gap:10px;align-items:center}
.pop{position:absolute;z-index:5;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 30px #0002;padding:6px;width:300px}
.scrim{position:fixed;inset:0;background:#0003;z-index:9;display:flex;align-items:center;justify-content:center}.dlg{background:#fff;border-radius:14px;padding:20px 22px;width:430px}
input,select{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:6px 9px}
.tog{width:30px;height:17px;border-radius:99px;background:#ccc;position:relative;cursor:pointer;flex:none}.tog.on{background:var(--fg)}.tog:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.15s}.tog.on:after{left:15px}
#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:99px;padding:7px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 18px #0006;z-index:20}
#bar button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}#bar select{background:#222;color:#fff;border-color:#444;padding:3px 6px}
.ctl{position:fixed;top:2px;right:16px;font-size:11px;color:var(--mut);display:flex;gap:8px;align-items:center}
.tag{font-size:10.5px;background:#eef;border-radius:5px;padding:0 5px;color:#44a}
</style></head><body>
<div class="ctl">Den-PC state: <select id="dstate"><option>connected</option><option>reconnecting</option><option>offline</option></select>
 Studio-Mac attention: <select id="attn"><option value="1">on</option><option value="0">off</option></select></div>
<div id="app"></div>
<div id="bar"><button id="prev">←</button><span id="lbl"></span><button id="next">→</button></div>
<script>
const V=[['A','Device groups in sidebar · pair in Settings'],['B','Device switcher pill · pair in popover'],['C','Flat list, device glyph · pair via Devices page + palette']];
const S={v:0,tab:'chat',dev:'connected',attn:true,allow:{den:true,studio:false},paired:true,dlg:null,pop:null,view:'all',
 pair:'idle',settings:false};
const q=new URLSearchParams(location.search);S.v=Math.max(0,'ABC'.indexOf(q.get('variant')||'A'));
const $=(s)=>document.querySelector(s);
const dst=()=>S.dev, dotc=(d)=>d==='connected'?'':d==='reconnecting'?'rec':'off';
const dlabel=d=>d==='connected'?'Connected':d==='reconnecting'?'Reconnecting…':'Offline';
// ---- data
const DEV=[{id:'me',name:'This Mac',local:true},{id:'den',name:'Den-PC'},{id:'studio',name:'Studio-Mac'}];
const state=id=>id==='den'?S.dev:'connected';
const PROJ=[
 {id:'p1',dev:'me',name:'spence',ses:[['Composer branch menu','',0],['Discard + revert','',0]]},
 {id:'p2',dev:'me',name:'dotfiles',ses:[['Neovim cleanup','',0]]},
 {id:'p3',dev:'den',name:'render-farm',ses:[['Fix shader cache','Waiting for your answer',1],['Batch queue','',0]]},
 {id:'p4',dev:'studio',name:'album-site',ses:[['Hero animation','Stopped with an error',2]]}];
const needs=p=>p.ses.some(s=>s[2]&&(p.dev!=='studio'||S.attn));
const dn=id=>DEV.find(d=>d.id===id).name;
// ---- bits
const sesRow=(p,s,glyph)=>{const off=state(p.dev)==='offline';return `<div class="row ${off?'dim':''}" onclick="openT('${p.id}','${s[0]}')">
 ${s[2]&&!off&&(p.dev!=='studio'||S.attn)?'<span class="att"></span>':'<span style="width:7px"></span>'}<div style="flex:1;min-width:0"><div>${s[0]}</div>${s[1]&&!off?`<div class="sub">${s[1]}</div>`:''}</div>${glyph||''}</div>`};
const devGlyph=id=>id==='me'?'':`<span class="chip">${dn(id)}</span>`;
function openT(pid,t){S.tab='chat';S.cur={pid,t};S.dlg=null;S.pop=null;S.settings=false;R()}
// ---- main chat area (shared content; layout differs per variant)
function chat(){
 const c=S.cur||{pid:'p3',t:'Fix shader cache'}, p=PROJ.find(x=>x.id===c.pid), d=state(p.dev), remote=p.dev!=='me';
 const head=`<div class="top"><div class="tabs">
  <div class="tab on">${remote?`<span class="dot ${dotc(d)}"></span>`:''}${c.t}${remote?`<span class="chip">${dn(p.dev)}</span>`:''}</div>
  <div class="tab">Commit log</div></div>
  ${remote&&d!=='connected'?`<span class="sub">${dlabel(d)}</span>`:''}<button class="btn" onclick="S.dlg='send';R()">Send to… ↗</button></div>`;
 const banner=d==='reconnecting'?`<div class="banner">Reconnecting to ${dn(p.dev)}… <span class="sub">transcript stays readable</span></div>`:
  d==='offline'?`<div class="banner">${dn(p.dev)} is offline. Showing the last transcript it sent. <button class="btn" onclick="S.dev='reconnecting';R()">Retry now</button></div>`:'';
 const block=remote&&d!=='connected';
 return head+`<div class="body">
  <div class="msg me">Why is the shader cache invalidated on every launch?</div>
  <div class="msg"><div class="prov">Agent · running on ${dn(p.dev)}</div>The cache key includes the driver build string, which changes after each GPU driver update… Want me to pin it?</div>
  <div class="msg me"><div class="prov">from Studio-Mac · Agent “release-bot” · asked under its Ask permission</div>Heads up: nightly render needs the cache warm by 02:00.</div>
  </div>`+banner+`<div class="comp"><div class="sub" style="font-size:13px;color:${block?'#aaa':'inherit'}">${block?'Can’t send while '+dn(p.dev)+' is '+dlabel(d).toLowerCase().replace('…','')+'.':'Ask anything…'}</div>
  <div class="st"><span>${remote?`Runs on ${dn(p.dev)}`:'Runs here'}</span>·<span>Claude</span>·<span>main</span>${remote?'<span style="flex:1"></span><span class="chip">Remote</span>':''}</div></div>`;
}
// ---- Settings > Devices page (shared by A & C, popover version for B differs)
function devicesPage(){
 const pairedRows=DEV.filter(d=>!d.local&&(S.paired||0)).map(d=>`<div class="card"><span class="dot ${dotc(state(d.id))}"></span><div class="g"><b>${d.name}</b> <span class="sub">${dlabel(state(d.id))}${d.id==='den'?' · 192.168.1.24:7421':''}</span>
  <div class="sub">Paired ${d.id==='den'?'Nov 2':'Nov 9'}</div></div>
  <label class="sub" style="display:flex;gap:6px;align-items:center">Allow Agents from this Device <span class="tog ${S.allow[d.id]?'on':''}" onclick="S.allow['${d.id}']=!S.allow['${d.id}'];R()"></span></label>
  <button class="btn d" onclick="S.dlg='unpair:${d.id}';R()">Unpair</button></div>`).join('');
 const found=S.pair==='idle'?`<div class="card"><span class="dot rec"></span><div class="g"><b>Kitchen-Laptop</b> <span class="sub">found on your network</span></div><button class="btn p" onclick="S.pair='code';R()">Pair…</button></div>
  <div class="sub" style="padding:2px 4px">Not listed? <a href="#" onclick="S.dlg='manual';R();return false">Enter host:port</a></div>`:
  S.pair==='code'?`<div class="card" style="flex-direction:column;align-items:flex-start"><b>Pairing with Kitchen-Laptop</b><div class="sub">On Kitchen-Laptop, open Settings → Devices and read the 6-digit code, then type it here. Codes work once and expire in 2 minutes.</div>
  <div style="display:flex;gap:8px"><input id="pc" placeholder="000000" maxlength="6" style="font:600 20px ui-monospace;width:140px;letter-spacing:.2em"><button class="btn p" onclick="S.pair='done';R()">Pair</button><button class="btn" onclick="S.pair='idle';R()">Cancel</button></div></div>`:
  `<div class="card"><span class="dot"></span><div class="g"><b>Kitchen-Laptop paired</b> <span class="sub">both directions · Agents from it are off</span></div><button class="btn" onclick="S.pair='idle';R()">Done</button></div>`;
 return `<h2 style="margin:0 0 4px">Devices</h2><div class="sub" style="margin-bottom:12px">Computers in your house running Spence. Only this network; nothing leaves it.</div>
 <div class="card"><div class="g"><b>Let other Devices connect to this Mac</b><div class="sub">Off by default. While on, this Mac must stay awake to be reachable.</div></div><span class="tog on"></span></div>
 <div class="card" style="background:var(--side)"><div class="g"><div class="sub">Show this code to the Device that is pairing with you</div><div class="code">482 913</div></div><span class="sub">expires 1:48</span></div>
 <div class="h">Paired</div>${pairedRows}<div class="h">Nearby</div>${found}`;
}
// ---- dialogs
function dlg(){
 if(!S.dlg)return'';let b='';
 if(S.dlg==='send')b=`<h3 style="margin:0 0 8px">Send a message to another Session</h3>
  <div class="sub">Pick a target on any Device. The receiver sees who sent it.</div>
  <div style="margin:10px 0;display:flex;flex-direction:column;gap:2px;max-height:210px;overflow:auto">
  ${PROJ.filter(p=>p.dev!=='me'||1).map(p=>p.ses.map(s=>`<div class="row" onclick="this.parentNode.querySelectorAll('.row').forEach(r=>r.classList.remove('on'));this.classList.add('on')">
   <span class="dot ${dotc(state(p.dev))}"></span><div style="flex:1">${s[0]} <span class="sub">· ${p.name}</span></div><span class="chip">${dn(p.dev)}</span></div>`).join('')).join('')}
   <div class="row"><span style="width:7px"></span><div style="flex:1">＋ New Session in…</div></div></div>
  <textarea style="width:100%;height:60px;border:1px solid var(--bd);border-radius:8px;padding:8px" placeholder="Message"></textarea>
  <div class="sub" style="margin:6px 0">Arrives labelled: <span class="tag">from This Mac · you</span> · Den-PC allows human messages always; Agent messages only if allowed.</div>
  <div style="text-align:right"><button class="btn" onclick="S.dlg=null;R()">Cancel</button> <button class="btn p" onclick="S.dlg=null;R()">Send</button></div>`;
 if(S.dlg.startsWith('unpair')){const id=S.dlg.split(':')[1];b=`<h3 style="margin:0 0 8px">Unpair ${dn(id)}?</h3><div class="sub">Its access is revoked on both sides immediately. Open Remote tabs stay as Offline stubs. You can pair again with a new code.</div><div style="text-align:right;margin-top:14px"><button class="btn" onclick="S.dlg=null;R()">Cancel</button> <button class="btn d" onclick="S.dlg=null;S.paired=false;R()">Unpair</button></div>`}
 if(S.dlg==='manual')b=`<h3 style="margin:0 0 8px">Connect by address</h3><div class="sub">For networks that block discovery.</div><p><input placeholder="192.168.1.30:7421" style="width:100%"></p><div style="text-align:right"><button class="btn" onclick="S.dlg=null;R()">Cancel</button> <button class="btn p" onclick="S.dlg=null;S.pair='code';R()">Continue</button></div>`;
 return `<div class="scrim" onclick="if(event.target===this){S.dlg=null;R()}"><div class="dlg">${b}</div></div>`;
}
// ---- Variant A: device groups in the sidebar; settings page holds everything
function A(){
 const pr=PROJ.filter(p=>p.dev==='me'||S.paired||p.dev==='x');
 const side=`<aside><div class="row" style="font-weight:600">Spence</div><div class="row">＋ New Session</div>
  ${DEV.filter(d=>S.paired||d.local).map(d=>{const ps=pr.filter(p=>p.dev===d.id),st=state(d.id),n=ps.some(needs)&&st!=='offline';
   return `<div class="h">${d.local?'':`<span class="dot ${dotc(st)}"></span>`}${d.name}${d.local?'':` <span style="flex:1"></span>${st!=='connected'?`<span class="chip">${dlabel(st)}</span>`:''}${n&&st==='connected'?'<span class="att"></span>':''}`}</div>`+
   ps.map(p=>`<div class="row" style="font-weight:500">▾ ${p.name}</div>`+p.ses.map(s=>sesRow(p,s)).join('')).join('')}).join('')}
  <div style="flex:1"></div><div class="row" onclick="S.settings=!S.settings;R()">⚙ Settings${S.paired?'':''}</div></aside>`;
 return side+`<main>${S.settings?`<div class="body">${devicesPage()}</div>`:chat()}</main>`;
}
// ---- Variant B: one-device-at-a-time pill + popover
function B(){
 const cur=S.view, pr=PROJ.filter(p=>cur==='all'?(p.dev==='me'||S.paired):p.dev===cur);
 const anyAtt=DEV.some(d=>d.id!=='me'&&PROJ.some(p=>p.dev===d.id&&needs(p))&&state(d.id)==='connected');
 const pop=S.pop==='dev'?`<div class="pop" style="left:10px;top:48px">
  ${[['all','Everything',''],...DEV.map(d=>[d.id,d.name,d.local?'':''])].filter(x=>S.paired||x[0]==='all'||x[0]==='me').map(([id,n])=>{const d=DEV.find(x=>x.id===id),st=d?state(id):'connected',at=d&&!d.local&&PROJ.some(p=>p.dev===id&&needs(p))&&st==='connected';
   return `<div class="row ${cur===id?'on':''}" onclick="S.view='${id}';S.pop=null;R()">${d&&!d.local?`<span class="dot ${dotc(st)}"></span>`:'<span style="width:7px"></span>'}<span style="flex:1">${n}</span>${st!=='connected'?`<span class="sub">${dlabel(st)}</span>`:''}${at?'<span class="att"></span>':''}${cur===id?'✓':''}</div>`}).join('')}
  <div style="border-top:1px solid var(--bd);margin:4px 0"></div>
  ${S.pair==='idle'?`<div class="row" onclick="S.pair='code';R()"><span class="dot rec"></span><span style="flex:1">Pair Kitchen-Laptop…</span><span class="sub">nearby</span></div>`:
   S.pair==='code'?`<div style="padding:6px 8px"><div class="sub">Type the code shown on Kitchen-Laptop</div><div style="display:flex;gap:6px;margin-top:4px"><input placeholder="000000" maxlength="6" style="width:110px;font:600 16px ui-monospace"><button class="btn p" onclick="S.pair='done';R()">Pair</button></div></div>`:
   `<div class="row" onclick="S.pair='idle';R()"><span class="dot"></span>Kitchen-Laptop paired ✓</div>`}
  <div class="row" onclick="S.settings=true;S.pop=null;R()">Manage Devices…</div></div>`:'';
 const side=`<aside style="position:relative"><div class="row" style="border:1px solid var(--bd);background:#fff" onclick="S.pop=S.pop?null:'dev';R()">
   <b style="flex:1">${cur==='all'?'All Devices':dn(cur)}</b>${anyAtt&&cur==='all'?'<span class="att"></span>':''}<span class="sub">⌄</span></div>${pop}
  <div class="row">＋ New Session</div>
  ${pr.map(p=>`<div class="row" style="font-weight:500;margin-top:6px">▾ ${p.name}${cur==='all'&&p.dev!=='me'?` <span style="flex:1"></span><span class="sub">${dn(p.dev)}</span>`:''}</div>`+p.ses.map(s=>sesRow(p,s)).join('')).join('')}
  <div style="flex:1"></div><div class="row" onclick="S.settings=!S.settings;R()">⚙ Settings</div></aside>`;
 return side+`<main>${S.settings?`<div class="body">${devicesPage()}</div>`:chat()}</main>`;
}
// ---- Variant C: flat list, tiny device glyph, status in footer, Devices is its own page
function C(){
 const pr=PROJ.filter(p=>p.dev==='me'||S.paired);
 const rem=DEV.filter(d=>!d.local&&S.paired), bad=rem.filter(d=>state(d.id)!=='connected');
 const side=`<aside><div class="row" style="font-weight:600">Spence</div><div class="row">＋ New Session</div>
  ${pr.map(p=>`<div class="h">${p.name}${p.dev!=='me'?` <span class="chip" title="${dn(p.dev)}">${dn(p.dev).split('-')[0]}</span>`:''}</div>`+p.ses.map(s=>sesRow(p,s)).join('')).join('')}
  <div style="flex:1"></div>
  ${S.paired?`<div class="row" onclick="S.tab='devices';S.settings=true;R()" style="color:var(--mut)">${rem.map(d=>`<span class="dot ${dotc(state(d.id))}"></span>`).join('')}<span style="flex:1">${bad.length?bad.map(d=>d.name+' '+dlabel(state(d.id)).toLowerCase()).join(', '):'2 Devices connected'}</span></div>`:
   `<div class="row sub" onclick="S.settings=true;R()">Connect other Devices…</div>`}
  <div class="row" onclick="S.settings=!S.settings;R()">⚙ Settings</div></aside>`;
 return side+`<main>${S.settings?`<div class="body"><div class="sub" style="margin-bottom:8px">Settings › Devices &nbsp;·&nbsp; also reachable from ⌘K “Pair a Device”</div>${devicesPage()}</div>`:chat()}</main>`;
}
function R(){
 $('#app').innerHTML=[A,B,C][S.v]()+dlg();$('#lbl').textContent=V[S.v][0]+' ('+V[S.v][1]+')';
 history.replaceState(null,'','?variant='+V[S.v][0]);
}
$('#dstate').onchange=e=>{S.dev=e.target.value;R()};$('#attn').onchange=e=>{S.attn=e.target.value==='1';R()};
const go=d=>{S.v=(S.v+d+3)%3;R()};$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
R();
</script></body></html>
